  var lb = Site.initLightbox();

  var PAINTINGS = [

  var grid = document.getElementById("painting-grid");
  PAINTINGS.forEach(function(item){ grid.appendChild(Site.card(item, lb.open)); });
  lb.setItems(PAINTINGS);

  Site.initReveal();
})();
